name: Update papers

# Daily data is normally pushed by a local Cowork task (~08:30 Beijing) together with
# Chinese summaries. This workflow:
#   - on every push to main: just publishes the site;
#   - at 11:30 Beijing: backup fetch, only if data.json is older than 20 h;
#   - on manual run: fetch now.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'

      - name: Fetch papers (backup)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/update.py ${{ github.event_name == 'schedule' && '--if-stale 20' || '' }}

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json summaries.json trends.json authors.json thumbs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update papers $(date -u +%F) (Actions backup)"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html explore.html config.json data.json trends.json .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
