name: Update papers

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 08:30 Beijing time
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ['data.json', 'summaries.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch papers and write Chinese summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python scripts/update.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json summaries.json
          git diff --cached --quiet || git commit -m "Update papers $(date -u +%F)"
          git push

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html config.json data.json .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
